<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Detector Bot Service</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#090d16;color:#e8edf7}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);padding:32px;border:1px solid #263247;border-radius:22px;background:#111827}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-right:9px}
    h1{font-size:23px;margin:0 0 12px}p{color:#aab6c8;line-height:1.65;margin:0}
    code{color:#c4d6ff}
  </style>
</head>
<body>
  <main>
    <h1><span class="dot"></span>Detector Bot Service</h1>
    <p>Endpoint layanan aktif di <code>/api/bot</code>. Pemeriksaan status internal tersedia melalui endpoint webhook.</p>
  </main>
</body>
</html>

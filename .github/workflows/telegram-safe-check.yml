name: Telegram infrastructure checks

on:
  push:
    branches:
      - main
      - recovery/telegram-safe-infra
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run status classifier regression tests
        run: npm run test:status
